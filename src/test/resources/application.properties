ratelimit.max-requests=1000
ratelimit.window-seconds=60

# The presence of this file on the test classpath shadows (not merges with)
# src/main/resources/application.properties for classpath:/application.properties
# resolution, so spring.sql.init.mode=always must be re-declared here too;
# otherwise schema.sql never runs against the Testcontainers Postgres instance
# and every test touching the call_log table fails with BadSqlGrammarException.
spring.sql.init.mode=always
